<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リロケーションチャート | HOSHITOURANAI</title>
<link rel="stylesheet" href="./engine/src/chart-header.css">
<link rel="stylesheet" href="./engine/src/brand/wordmark.css">
<link rel="stylesheet" href="./style.css">
<main>
<header class="chart-header"><div class="chart-heading"><span class="chart-brand brand-lockup"><img src="./engine/brand/wordmark-original.png" alt="HOSHITOURANAI" width="1450" height="290"></span><h1>リロケーションチャート</h1></div></header>
<form id="controls">
<div class="inputs">
<label class="chart-title-input">任意タイトル<input id="chart-title" type="text" maxlength="80" placeholder="例：Aさんの出生図"></label>
<label>出生地の現地日付<input id="date" type="date" value="2027-12-21" required></label>
<label>現地時刻<input id="time" type="time" value="09:00" required></label>
<label class="inline-check"><input id="unknown-time" type="checkbox">出生時刻不明</label>
<label>ハウス方式<select id="houses">
<option value="placidus">プラシーダス</option>
<option value="whole">ホールサイン</option>
<option value="equal">イコール</option>
<option value="solar">サンサイン</option>
<option value="natural">ナチュラル</option>
</select></label>
<div class="place-input"><label>出生地<select id="origin"></select></label>
<button type="button" class="coordinate-button" id="origin-custom" aria-controls="origin-coordinates">緯度・経度で指定</button></div>
<div class="place-input"><label>移転先<select id="target"></select></label>
<button type="button" class="coordinate-button" id="target-custom" aria-controls="target-coordinates">緯度・経度で指定</button></div>
<button type="submit">チャートを表示</button>
</div>
<div id="origin-coordinates" class="coordinates" hidden>
<label>出生地の緯度<input id="origin-lat" type="number" step="any" min="-89.999999" max="89.999999" required disabled></label>
<label>出生地の経度<input id="origin-lon" type="number" step="any" min="-180" max="180" required disabled></label>
<label>出生地のタイムゾーン<select id="origin-zone" required disabled></select></label>
</div>
<div id="target-coordinates" class="coordinates" hidden>
<label>移転先の緯度<input id="target-lat" type="number" step="any" min="-89.999999" max="89.999999" required disabled></label>
<label>移転先の経度<input id="target-lon" type="number" step="any" min="-180" max="180" required disabled></label>
</div>
<p id="coordinate-help" hidden>緯度は北、経度は東を正の値で入力してください。</p>
<label id="ambiguity" hidden>出生時刻の候補<select id="candidate"></select></label>
<fieldset><legend>表示する感受点・小惑星</legend><div id="points"></div></fieldset>
<fieldset class="aspect-picker"><legend>アスペクト</legend>
<div class="aspect-controls">
<select id="aspect-pair" aria-label="アスペクト"><option value="">線を表示しない</option></select>
<button id="all-aspects" type="button" aria-pressed="false" disabled>すべてを表示</button>
<label><input id="extra-aspects" type="checkbox">追加した小惑星・感受点も含める</label>
</div></fieldset>
<label>PoFの計算方式<select id="fortune"><option value="sect">昼夜で切替</option><option value="day-formula">常に昼の式</option></select></label>
</form>
<h2 id="custom-title" class="custom-title">リロケーションチャート</h2>
<p id="status" role="status">天文暦を読み込み中…</p>
<section id="results" hidden aria-labelledby="custom-title">
<div class="charts"><article><h2 id="birth-title"></h2><p id="birth-house"></p><div id="birth-wheel"></div></article>
<article><h2 id="target-title"></h2><p id="target-house"></p><div id="target-wheel"></div></article></div>
<div class="export"><button id="png" type="button" disabled>16:9 PNGを保存</button>
<a id="png-download" hidden download="hoshitouranai-relocation-1920x1080.png">PNGを保存</a>

<span id="png-status" role="status"></span></div>
<details id="png-open" class="png-preview" hidden>
<summary>PNG画像を開く</summary>
<img id="png-image" alt="保存用のリロケーションチャート">
<p>PCでは画像を右クリックして「名前を付けて画像を保存」を選べます。</p>
<a id="png-tab" target="_blank" rel="noopener">画像を別タブで開く</a>
</details>
<section class="chart-table-panel"><div class="table-head"><h2 id="positions-heading">天体・感受点の位置</h2><label><input type="checkbox" id="changed">変化したハウスのみ</label></div>
<div class="scroll"><table class="positions-table" aria-labelledby="positions-heading"><thead><tr><th scope="col" rowspan="2">天体・感受点</th><th scope="colgroup" colspan="2">出生地</th><th scope="colgroup" colspan="2">移転先</th></tr>
<tr><th scope="col">サイン・度数</th><th scope="col">ハウス</th><th scope="col">サイン・度数</th><th scope="col">ハウス</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section class="chart-table-panel"><div class="table-head"><h2 id="cusps-heading">ハウスカスプの比較</h2></div>
<div class="scroll"><table class="cusp-table" aria-labelledby="cusps-heading">
<thead><tr><th scope="col">ハウス</th><th scope="col">出生地のサイン・度数</th><th scope="col">移転先のサイン・度数</th></tr></thead>
<tbody id="cusp-rows"></tbody></table></div></section>
</section>
</main>
<script type="module" src="./app.mjs"></script>
</html>
